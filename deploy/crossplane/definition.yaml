# CompositeResourceDefinition (XRD): the declarative platform API.
# Crossplane v2 (v2.3): Composite Resources are namespaced and Claims are gone —
# operators create the `AgennextPlatform` XR directly in a namespace. The new
# `scope: Namespaced` field replaces the old claim/X-prefix split.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: agennextplatforms.platform.agennext.com
spec:
  scope: Namespaced
  group: platform.agennext.com
  names:
    kind: AgennextPlatform
    plural: agennextplatforms
  defaultCompositionRef:
    name: agennext-platform
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    image:
                      type: string
                      default: ghcr.io/agennext/agennext.com:latest
                    replicas:
                      type: integer
                      default: 2
                      minimum: 1
                    connector:
                      type: string
                      enum: ["memory", "surreal"]
                      default: memory
                    surrealUrl:
                      type: string
                    writeApi:
                      type: boolean
                      default: false
                    trustDomain:
                      type: string
                      default: agennext.com
                  required: [image]
              required: [parameters]
            status:
              type: object
              properties:
                condition:
                  type: string
                nodes:
                  type: integer
