# Composition: how an AgennextPlatform is realized.
# Pipeline mode with function-patch-and-transform composes provider-kubernetes
# Objects (a Deployment + a Service) and patches them from the XR parameters.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: agennext-platform
  labels:
    provider: kubernetes
spec:
  compositeTypeRef:
    apiVersion: platform.agennext.com/v1alpha1
    kind: XAgennextPlatform
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: deployment
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata:
                      name: agennext
                      labels:
                        app.kubernetes.io/name: agennext
                        app.kubernetes.io/managed-by: crossplane
                    spec:
                      replicas: 2
                      selector:
                        matchLabels:
                          app.kubernetes.io/name: agennext
                      template:
                        metadata:
                          labels:
                            app.kubernetes.io/name: agennext
                          annotations:
                            prometheus.io/scrape: "true"
                            prometheus.io/path: /api/metrics
                            prometheus.io/port: "3000"
                        spec:
                          containers:
                            - name: agennext
                              image: ghcr.io/agennext/agennext.com:latest
                              ports:
                                - containerPort: 3000
                              livenessProbe:
                                httpGet:
                                  path: /api/healthz
                                  port: 3000
                              readinessProbe:
                                httpGet:
                                  path: /api/readyz
                                  port: 3000
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.replicas
                toFieldPath: spec.forProvider.manifest.spec.replicas
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.image
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].image
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.trustDomain
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].env[0].value
                policy:
                  fromFieldPath: Required
              - type: ToCompositeFieldPath
                fromFieldPath: status.conditions[0].reason
                toFieldPath: status.condition
          - name: service
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Service
                    metadata:
                      name: agennext
                      labels:
                        app.kubernetes.io/name: agennext
                    spec:
                      selector:
                        app.kubernetes.io/name: agennext
                      ports:
                        - name: http
                          port: 80
                          targetPort: 3000
