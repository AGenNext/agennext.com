# Cloud-native deployment for AGenNext.
# Liveness/readiness wired to the platform probes; annotations expose the
# OpenMetrics endpoint for an OpenTelemetry Collector / HertzBeat scrape.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agennext
  labels:
    app.kubernetes.io/name: agennext
    app.kubernetes.io/part-of: agennext-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agennext
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agennext
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /api/metrics
        prometheus.io/port: "3000"
        # SPIFFE workload identity for SPIRE-issued SVIDs.
        spiffe.io/spiffe-id: spiffe://agennext.com/platform
    spec:
      containers:
        - name: agennext
          image: ghcr.io/agennext/agennext.com:latest
          ports:
            - containerPort: 3000
          env:
            - name: SPIFFE_TRUST_DOMAIN
              value: agennext.com
            # Opt-in SurrealDB connector (OpenFeature flag + connection URL):
            # - name: FLAG_SURREAL_CONNECTOR
            #   value: "true"
            # - name: SURREAL_URL
            #   value: http://surrealdb:8000
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agennext
  labels:
    app.kubernetes.io/name: agennext
spec:
  selector:
    app.kubernetes.io/name: agennext
  ports:
    - name: http
      port: 80
      targetPort: 3000
