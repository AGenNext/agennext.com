# GitOps with Flux: the cluster continuously reconciles to this repo.
# Flux applies deploy/crossplane (the control-plane API) and the platform
# claim, so a git push is the only deploy action.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: agennext
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/AGenNext/agennext.com
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agennext-control-plane
  namespace: flux-system
spec:
  interval: 5m
  prune: true
  sourceRef:
    kind: GitRepository
    name: agennext
  path: ./deploy/crossplane
